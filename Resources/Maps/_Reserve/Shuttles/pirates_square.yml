- proto: Paper
  entities:
  - uid: 859
    components:
    - type: MetaData
      name: документация "РСПК-1984"
      desc: Полное описание характеристик шаттла и его особенностей.
    - type: Transform
      parent: 858
    - type: Paper
      stampState: paper_stamp-ok
      stampedBy:
      - stampLargeIcon: large_stamp-ok
        stampFont: null
        stampedName: stamp-component-stamped-name-approved
        stampedColor: '#00BE00FF'
        hasIcon: True
      content: >-
        [head=2][color=#a5671b]ШАТТЛ РСПК-1984[/color][/head]

        ─────────────────────────────────────────

        [head=3]Характеристики[/head]


        - Тип: [bold]Шаттл[/bold]

        - Модель: РСП [bold]"Квадрат"[/bold]

        - Размер: [bold]крошечный[/bold]

        - Рекомендуемый размер команды: [bold]1-6 человек[/bold]

        - Максимальный размер команды: [bold]8 человека[/bold]

        ─────────────────────────────────────────

        [head=3]Особенности[/head]


        - Присутсвуют следующие отделы:
          - [bold]Рея[/bold] (основной стык);
          - [bold]Запасные выходы[/bold] слева и справа шаттла;
          - [bold]Медбей[/bold] при входе в шаттл;
          - [bold]Уборная[/bold] при входе в шаттл;
          - [bold]Бриг[/bold] при входе в шаттл - хорошо защищён;
          - [bold]Мостик[/bold] со всем необходимым оборудованием;
          - [bold]Каюта капитана[/bold] с видом на космос и опциональной приватностью;
          - [bold]Инженерная[/bold] удобно совмещена с залом изъятия прибыли;
          - [bold]Зал изъятия прибыли[/bold] с сифоном прибыли и консолью продаж;
          - [bold]Корридорная раздевалка[/bold];
          - [bold]Просторная оружейная[/bold] забитая доверху;
          - [bold]Атмосферный бар[/bold], кишащий выпивкой.

        - Во всех помещениях присутствуют [bold]выключатели света[/bold] - благодаря ним свет можно выключить [bold]на всем шаттле[/bold].

        ─────────────────────────────────────────

        [color=#d3d3d3]

        [bold]Авторство[/bold]: RSPS-1984 это улучшенная версия старого шаттла пиратов, сделанная специально для Резерва.

        - Авторы изменений: Ceterai

        [bold]Credits[/bold]: RSPS-1984 is an improved version of the old pirate shuttle, made exclusively for the Reserve Station server.

        - Authors of changes: Ceterai

        [/color]
    - type: Physics
      canCollide: False
