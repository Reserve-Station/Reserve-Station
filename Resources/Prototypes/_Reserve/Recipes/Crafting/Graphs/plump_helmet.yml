# hollow out a plump helmet with a knife to get a wearable helmet
- type: constructionGraph
  id: PlumpHelmetHelmet
  start: start
  graph:
  - node: start
    edges:
    - to: helmet
      steps:
      - tool: Slicing
        doAfter: 2

  - node: helmet
    entity: ClothingHeadHelmetPlump
