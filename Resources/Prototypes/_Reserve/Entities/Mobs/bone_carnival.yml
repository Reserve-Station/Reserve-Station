# region Entities

- type: entity
  id: MobSkeletonHostile
  abstract: true
  components:
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: CombatMode

- type: entity
  id: MobSkeletonGladiator
  parent: MobSkeletonPerson
  components:
  - type: GhostRole
    name: ghost-role-information-skeleton-gladiator-name
    description: ghost-role-information-skeleton-gladiator-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [BoneCarnivalSkeletonGladiatorGear]
