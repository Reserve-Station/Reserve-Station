- type: entity
  name: plump helmet
  parent: FoodProduceBase
  id: FoodPlumpHelmet
  description: A fat purple mushroom. Hard to believe something this plump grows in the dark.
  components:
  - type: FlavorProfile
    flavors:
      - mushroom
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 1
  - type: Sprite
    sprite: _Reserve/Objects/Specific/Hydroponics/plump_helmet.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: plumphelmet
  - type: Construction
    graph: PlumpHelmetHelmet
    node: start
  - type: Tag
    tags:
    - Vegetable
    - Mushroom
