# region Tomato mutant

- type: entity
  parent:
  - BaseSimpleMob
  - MobDamageable
  - MobPolymorphable
  - MobBloodstream
  - MobFlammable
  - MobCombat
  id: MobTomatoKillerMutant
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
