# Title: Halloween on Reserve Station

# A small collection of festive admemes and Halloween-themed objects and items brought by Orchi Dea to Reserve.





# region PROTOTYPES





# region Bats

- type: entity
  id: MobBatAngryBase
  abstract: true
  components:
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ZombieImmune

- type: entity
  parent: [MobBatAngryBase, MobBat]
  id: MobBatAngry
  components:
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ZombieImmune

- type: entity
  parent: MarkerBase
  id: SpawnMobBatAngry
  components:
  - type: Sprite
    layers:
    - state: green
    - state: ai
  - type: RandomSpawner
    prototypes:
    - MobBatAngry

- type: entity
  parent: MobBat
  id: MobBatBlack
  components:
  - type: Sprite
    color: "#668888"

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatBlack
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatBlack

- type: entity
  parent: [MobBatAngryBase, MobBatBlack]
  id: MobBatBlackAngry

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatBlackAngry
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatBlackAngry

- type: entity
  parent: MobBat
  id: MobBatBloodRed
  components:
  - type: Sprite
    color: "#880000"
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 250
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Blood
          Quantity: 30
  - type: Butcherable
    spawned:
    - id: PuddleBlood
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      80: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 120
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: Item

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatBloodRed
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatBloodRed

- type: entity
  parent: [MobBatAngryBase, MobBatBloodRed]
  id: MobBatBloodRedAngry

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatBloodRedAngry
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatBloodRedAngry

- type: entity
  parent: MobBat
  id: MobBatVampire
  components:
  - type: Sprite
    scale: 1.5, 1.5
    color: "#668888"
  - type: Tag
    tags:
    - DoorBumpOpener
    - VimPilot
  - type: MindContainer
  - type: MindExaminable
  - type: Alerts
  - type: LanguageKnowledge
    speaks:
    - Mouse
    - TauCetiBasic
    understands:
    - Mouse
    - TauCetiBasic
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      120: Dead

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatVampire
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatVampire

- type: entity
  parent: [MobBatAngryBase, MobBatVampire]
  id: MobBatVampireAngry

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatVampireAngry
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatVampireAngry

# Random spawners

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatAny
  components:
  - type: RandomSpawner
    prototypes:
    - MobBat
    - MobBatBlack
    rarePrototypes:
    - MobBatBloodRed
    rareChance: 0.05

- type: entity
  parent: SpawnMobBatAngry
  id: SpawnMobBatAnyAngry
  components:
  - type: RandomSpawner
    prototypes:
    - MobBatAngry
    - MobBatBlackAngry
    rarePrototypes:
    - MobBatBloodRedAngry
    rareChance: 0.05

# endregion Bats

# region Candy buckets

- type: entityTable
  id: CandyTable
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      # Random
      - id: FoodSnackLollypopWrappedMystery
        weight: 1.5
      # Orchi Dea
      - !type:GroupSelector
        children:
        - id: FoodSnackOrchito
        - id: FoodSnackStardustOrchito
        - id: FoodSnackStardust
        - id: FoodSnackStardustGoddess
        weight: 1.5
      - !type:GroupSelector
        children:
        - id: FoodSnackLollypopOrchito
        - id: FoodSnackLollypopStardustOrchito
        - id: FoodSnackLollypopStardust
        - id: FoodSnackLollypopStardustGoddess
      # Reserve
      - !type:GroupSelector
        children:
        - id: FoodSnackLollypopBrepsi
        - id: FoodSnackLollypopBacchusBlessing
        - id: FoodSnackLollypopIce
        - id: FoodSnackLollypopProtein
      # Medical
      - !type:GroupSelector
        children:
        - id: FoodSnackLollypopAntihol
        - id: FoodSnackLollypopDexalinPlus
        - id: FoodSnackLollypopDylovene
        weight: 0.5
      # Regular
      - id: FoodSnackLollypop
      - id: FoodSnackLollypopCarp
      - id: FoodSnackLollypopRainbow
      - id: FoodSnackLollypopWeh
      # Bars
      - !type:GroupSelector
        children:
        - id: FoodSnackChocolate
        - id: FoodSnackChocolateBar
        - id: FoodSnackEnergy
        - id: FoodSnackProteinbar
          weight: 1.5
      # Other snacks
      - !type:GroupSelector
        children:
        - id: FoodSnackChocobanana
        - id: FoodSnackCookieFortune
          weight: 1.5
        - id: FoodSnackDango
        - id: FoodSnackLunacakeWrapped
        - id: FoodSnackMochicakeWrapped
        - id: FoodSnackMooncakeWrapped
        - id: FoodSnackPokeysticks
          weight: 0.5
      # Command candy, rarely
      - !type:GroupSelector
        children:
        - id: FoodSnackLollypopCentcomm
        - id: FoodSnackLollypopCaptain
        - id: FoodSnackLollypopBlueshield
        weight: 0.2
      # Crayons, rarely
      - !type:NestedSelector
        tableId: AllCrayonsTable
        weight: 0.2

- type: entity
  parent: BaseStorageItem  # Not deriving from CandyBucket because of broken ContainerHeld
  id: CandyBucketFilled
  components:
  - type: Sprite
    sprite: Objects/Fun/candy_bucket.rsi
    state: full_icon
  - type: Item
    heldPrefix: full
    size: Normal
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,2
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        - Pill
      tags:
        - FoodSnack
        - Crayon
  - type: Dumpable
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: CandyTable
        rolls: 8, 12

- type: entityTable
  id: CandyTableMystery
  table: !type:AllSelector
    children:
    - id: FoodSnackLollypopWrappedMysteryNeutral

- type: entity
  parent: CandyBucketFilled
  id: CandyBucketFilledMystery
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: CandyTableMystery
        rolls: 8, 12

- type: entityTable
  id: CandyTableMysteryEvil
  table: !type:AllSelector
    children:
    - id: FoodSnackLollypopWrappedMysteryEvil

- type: entity
  parent: CandyBucketFilled
  id: CandyBucketFilledMysteryEvil
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: CandyTableMysteryEvil
        rolls: 8, 12

- type: entity
  parent: CandyBucketFilled
  id: CandyBucketFilledAny
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: CandyTable
          rolls: 8, 12
        - !type:NestedSelector
          tableId: CandyTableMystery
          rolls: 8, 12
          weight: 0.6
        - !type:NestedSelector
          tableId: CandyTableMysteryEvil
          rolls: 8, 12
          weight: 0.3

- type: entity
  parent: CandyBucket
  id: CandyBucketLarge
  components:
  - type: Sprite
    scale: 1.2, 1.2
    color: "#ffcccc"
  - type: Storage
    grid:
    - 0,0,6,4

- type: entity
  parent: CandyBucket
  id: CandyBucketBluespace
  components:
  - type: Sprite
    scale: 1.3, 1.3
    color: "#eeff66"
  - type: Storage
    grid:
    - 0,0,8,6

- type: entityTable
  id: CandyBucketTable
  table: !type:GroupSelector
    children:
    - id: CandyBucket
      weight: 0.4
    - id: CandyBucketFilledAny
    - id: CandyBucketLarge
      weight: 0.2
    - id: CandyBucketBluespace
      weight: 0.075

- type: entity
  parent: MarkerBase
  id: SpawnCandyBucket
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Fun/candy_bucket.rsi
      state: full_icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: CandyBucketTable

