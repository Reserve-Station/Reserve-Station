- type: entity
  name: AP Pistol
  parent: [BaseWeaponPistol, BaseSyndicateContraband]
  id: WeaponPistolAP
  description: A fast, tactic, not silent handgun came from old town named [REDACTED]. For his price - this is a best idea to 'rock n' roll
  components:
  - type: Sprite
    sprite: Reserve/Objects/Weapons/Guns/Pistols/ap_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Reserve/Objects/Weapons/Guns/Pistols/ap_pistol.rsi
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
  - type: Gun
    fireRate: 10
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
      params:
        volume: 7
    projectileSpeed: 35 # Goobstation
    availableModes:
    - SemiAuto
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: MagazinePistol
        startingItem: MagazinePistolHighCapacity
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
