# region Antags

- type: antag
  id: PirateCaptain
  name: roles-antag-pirate-captain-name
  antagonist: true
  setPreference: true
  objective: roles-antag-pirate-objective
  requirements:
  - !type:OverallPlaytimeRequirement
      time: 30h
  - !type:SpeciesRequirement
    inverted: true
    species:
    - Plasmaman
  guides: [ Pirates ]
  category: Team
  icon:
    sprite: Structures/Wallmounts/flags.rsi
    state: pirate_flag

# endregion Antags

# region Gear

- type: startingGear
  id: EmptyNudeGear
  equipment: {}

# endregion Gear

# region Rules

# Roundstart pirates. For midround pirates, see PiratesMidround.

- type: entity
  parent: BaseGameRule
  id: Pirates
  components:
  - type: ActivePirateRule
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Reserve/Shuttles/pirates_square.yml
  - type: AntagLoadProfileRule
    speciesOverride: Human
    alwaysUseSpeciesOverride: true
  - type: GameRule
    minPlayers: 15
    chaosScore: 650
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    agentName: pirates-roundend-name
    definitions:
    - prefRoles: [ PirateCaptain ]
      fallbackRoles: [ Pirate ]
      spawnerPrototype: GhostRolePirateCaptain
      min: 1
      max: 1
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
      lateJoinAdditional: true
      mindRoles:
      - MindRolePirate
      startingGear: PirateCaptainGear
      unequipOldGear: true
      components:
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
    - prefRoles: [ Pirate ]
      fallbackRoles: [ PirateCaptain ]
      spawnerPrototype: GhostRolePirates
      min: 2
      max: 5
      playerRatio: 7
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
      lateJoinAdditional: true
      mindRoles:
      - MindRolePirate
      startingGear: PirateGear
      unequipOldGear: true
      components:
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
  - type: Tag
    tags:
      - RoundstartAntag

# A single pirate, no ship - for antag verbs

- type: entity
  parent: BaseGameRule
  id: PirateSingleAntagVerb
  components:
  - type: ActivePirateRule
  - type: AntagLoadProfileRule
    speciesOverride: Human
    alwaysUseSpeciesOverride: true
  - type: AntagSelection
    definitions:
    - spawnerPrototype: GhostRolePirates
      pickPlayer: false
      min: 5
      max: 5
      mindRoles:
      - MindRolePirate
      startingGear: PirateGear
      unequipOldGear: true
      components:
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
  - type: Tag
    tags:
    - MidroundAntag

# endregion Rules

