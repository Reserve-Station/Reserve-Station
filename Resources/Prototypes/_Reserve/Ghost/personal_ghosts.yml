# region Abstract

# Abstract entproto to force transparency on all custom ghosts
- type: entity
  abstract: true
  parent: MobObserver
  id: MobObserverCkey
  components:
  - type: Sprite
    color: "#ffffffcc" # 0.8 alpha

# endregion Abstract

# region Ca4tuk

- type: customGhost
  id: ca4tuk-ghost
  category: personal
  proto: MobObserverCkeyCa4tuk
  restrictions:
  - !type:CkeyRestriction
    ckey: [ca4tuk, AwareFoxy]
  trail:
    color: "#FFFFFF"
    maxPoints: 40
    lineWidth: 2.6
    minDistance: 0.10
    decayDelay: 2.6
    decayInterval: 0.15
    shader: HolyStarsTrail
  name: ca4tuk
  description: ДА

- type: entity
  parent: MobObserverCkey
  id: MobObserverCkeyCa4tuk
  components:
  - type: Sprite
    sprite: _Reserve/Ghosts/ca4tuk-ghost.rsi
    color: "#F2F2F2"

# endregion Ca4tuk

