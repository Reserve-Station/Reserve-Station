# region Abstract

- type: customGhost
  id: default
  category: color
  proto: MobObserver

# endregion Abstract

# region Red

- type: customGhost
  id: red
  proto: MobObserverRed
  category: color
  restrictions:
  - !type:PlaytimeServerRestriction
    hoursPlaytime: 1

- type: entity
  parent: MobObserver
  id: MobObserverRed
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#f228"
    layers:
    - state: animated
      shader: unshaded

# endregion Red

