- type: roleLoadout
  id: AntagThief
  groups:
  - BagThief
  - NeckThief
  - TrinketsThief

- type: loadoutGroup
  id: TrinketsThief
  name: loadout-group-trinkets
  minLimit: 0
  maxLimit: 2
  loadouts:
  - RagThief
  - DrinkMugThief
  - FlippoThief
  - CigarCaseThief
  - CardBoxThief
  - d6DiceThief
  - CrayonThief
  - FolderThief
  - TowelThief
  - RingThief
  - HeadBandThief
  - CatHatThief

- type: loadoutGroup
  id: NeckThief
  name: lathe-category-neck
  minLimit: 0
  maxLimit: 1
  loadouts:
  - MaskThief
  - TieThief
  - GaiterThief
  - PonchoThief
  - PonchoSmallThief
  - ScarfThief

- type: loadoutGroup
  id: BagThief
  name: loadout-group-instruments
  minLimit: 1
  maxLimit: 1
  loadouts:
  - SatchelThief
  - ToolboxThief

# region Bag

- type: loadout
  id: SatchelThief
  storage:
    back:
    - SatchelThief

- type: loadout
  id: ToolboxThief
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:OverallPlaytimeRequirement
      time: 50h
  storage:
    back:
    - ToolboxThief

# region Rag

- type: entity
  parent: RagItem
  id: RagItemBlack
  name: black rag
  description: Would be hard to spot fingerprints on this one.
  suffix: Loadout, Trinkets, Thief
  components:
  - type: Sprite
    layers:
    - state: rag
      color: "#535353"
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-3
      visible: false

- type: loadout
  id: RagThief
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobBartender
      time: 25h
  storage:
    back:
    - RagItemBlack
  groupBy: "misc"

# endregion

