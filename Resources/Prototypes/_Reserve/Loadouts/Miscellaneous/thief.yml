- type: entity
  parent: CrayonBlack
  id: CrayonBlackThiefDummy
  categories: [ HideSpawnMenu ]
  name: four black crayons
  components:
  - type: Sprite
    layers:
    - state: black
      offset: 0, -0.25
    - state: black
      offset: 0.1, 0.25
    - state: black
      offset: -0.25, 0
    - state: black
      offset: 0.35, 0

- type: loadout
  id: CrayonThief
  dummyEntity: CrayonBlackThiefDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobMime
      time: 30h
  storage:
    back:
    - CrayonBlack
    - CrayonBlack
    - CrayonBlack
    - CrayonBlack
  groupBy: "cards"

