- type: entity
  parent: d6DiceBlack
  id: d6DiceBlackTwoDummy
  categories: [ HideSpawnMenu ]
  name: two black dice
  components:
  - type: Sprite
    layers:
    - state: d6_6
      color: "#939393"
      offset: -0.1, -0.15
    - state: d6_6
      color: "#939393"
      offset: 0.15, 0.1

- type: loadout
  id: d6DiceThief
  dummyEntity: d6DiceBlackTwoDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
