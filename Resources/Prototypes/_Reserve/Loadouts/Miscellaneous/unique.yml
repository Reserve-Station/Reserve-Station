# region Group

- type: loadoutGroup
  id: UniqueReserveItems
  name: loadout-group-unique-reserve-items
  minLimit: 1000  # So any new items are auto-applied.
  maxLimit: 1000
  hidden: true
  loadouts:
  - Orchito
  - Stardust
  - ALittleStar

# endregion

# region Items

- type: loadout
  id: Orchito
  effects:
  - !type:CkeyRequirementLoadoutEffect
    ckey: [ Ceterai ]
  storage:
    back:
    - DrinkOrchitoGlass

- type: loadout
  id: Stardust
  effects:
  - !type:CkeyRequirementLoadoutEffect
    ckey: [ Ceterai ]
  storage:
    back:
    - PillCanisterStardust

- type: loadout
  id: ALittleStar
  effects:
  - !type:CkeyRequirementLoadoutEffect
    ckey: [ Ceterai ]
  storage:
    back:
    - DiskCaseALittleStar
    - VinylSleeveALittleStar

# endregion
