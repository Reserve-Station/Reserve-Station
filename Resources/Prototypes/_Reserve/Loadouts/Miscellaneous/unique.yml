# region Group

- type: loadoutGroup
  id: UniqueReserveItems
  name: loadout-group-unique-reserve-items
  minLimit: 1000  # So any new items are auto-applied.
  maxLimit: 1000
  hidden: true
  loadouts:
  - Orchito
  - Stardust
  - ALittleStar
  - PlushieCeteraiOrchiDea
  - PlushieArtizziKasya
  - PlushieAwareFoxy
  - PlushieDotusaruTaipan
  - PlushieFloppaGeoffroyKrisp
  - PlushieMrSamuelGoose
  - PlushieNazrinNyaCap
  - PlushieSvarshikEva
  - HalloweenCandyBucket

# endregion

