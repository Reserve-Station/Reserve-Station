  - TrinketsSyndicate

- type: roleLoadout
  id: AntagNukeopsCommander
  groups:
  - TrinketsSyndicate

- type: loadoutGroup
  id: TrinketsSyndicate
  name: loadout-group-trinkets
  minLimit: 0
  maxLimit: 2
  loadouts:
  - RagSyndicate
  - FoodSnackLollypopSyndicate
  - DrinkMugSyndicate
  - TennisRacketSyndicate
  - BalloonSyndicate
  - d6DiceSyndicate
  - CardBoxSyndicate
  - CassetteSyndicate
  - CdDiskSyndicate
  - BusinessCardSyndicate
  - FolderSyndicate
  - TowelSyndicate
  - TowelSyndicateRed
  - TowelSyndicateGreen
  - TowelSyndicateBlack
  - FlippoSyndicate
  - CigarCaseSyndicate
  - NukieRing
  - PlushieNuke
  - NukieCan

# region Rag

- type: entity
  parent: RagItem
  id: RagItemBloodRed
  name: blood-red rag
  description: Would be hard to spot actual blood stains on this one.
  suffix: Loadout, Trinkets, Syndicate
  components:
  - type: Sprite
    layers:
    - state: rag
      color: "#940000"
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-3
      visible: false

- type: loadout
  id: RagSyndicate
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobBartender
      time: 25h
  storage:
    back:
    - RagItemBloodRed
  groupBy: "misc"

# endregion

