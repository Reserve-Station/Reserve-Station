# region Candy

- type: entity
  parent: FoodSnackLollypopSyndicate
  id: FoodSnackLollypopSyndicateDummy
  categories: [ HideSpawnMenu ]
  name: three blood-red lollypops
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
      offset: 0, -0.25
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#810e0e"
      offset: 0, -0.25
    - state: lollypop
      offset: -0.1, 0.1
    - state: color
      color: "#810e0e"
      offset: -0.1, 0.1
    - state: lollypop
      offset: 0.25, 0
    - state: color
      color: "#810e0e"
      offset: 0.25, 0

- type: loadout
  id: FoodSnackLollypopSyndicate
  dummyEntity: FoodSnackLollypopSyndicateDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChef
      time: 35h
  storage:
    back:
    - FoodSnackLollypopWrappedSyndicate
    - FoodSnackLollypopWrappedSyndicate
    - FoodSnackLollypopWrappedSyndicate
  groupBy: "candy"

# endregion

