# region Drinks

- type: loadout
  id: DrinkMugWizard
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:OverallPlaytimeRequirement
      time: 35h
  storage:
    back:
    - DrinkMugBlue
  groupBy: "drinks"

- type: loadout
  id: DrinkMugRainbowWizard
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:OverallPlaytimeRequirement
      time: 70h
  storage:
    back:
    - DrinkMugRainbow
  groupBy: "drinks"

# endregion

# region Candy

- type: entity
  parent: FoodSnackLollypopDylovene
  id: FoodSnackLollypopWizard
  name: wizard lollypop
  description: A lollypop filled with a special magic cocktail.
  suffix: Loadout, Trinkets, Wizard
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#f333a3"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: BacchusBlessing
          Quantity: 15

- type: entity
  parent: FoodSnackLollypopWizard
  id: FoodSnackLollypopWizardDummy
  categories: [ HideSpawnMenu ]
  name: three wizard lollypops
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
      offset: 0, -0.25
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#f333a3"
      offset: 0, -0.25
    - state: lollypop
      offset: -0.1, 0.1
    - state: color
      color: "#f333a3"
      offset: -0.1, 0.1
    - state: lollypop
      offset: 0.25, 0
    - state: color
      color: "#f333a3"
      offset: 0.25, 0

- type: loadout
  id: FoodSnackLollypopWizard
  dummyEntity: FoodSnackLollypopWizardDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobBartender
      time: 45h
  storage:
    back:
    - FoodSnackLollypopWizard
    - FoodSnackLollypopWizard
    - FoodSnackLollypopWizard
  groupBy: "candy"

- type: entity
  parent: FoodSnackLollypopWrappedMystery
  id: FoodSnackLollypopWrappedMysteryDummy
  categories: [ HideSpawnMenu ]
  name: three mystery lollypops
  components:
  - type: Sprite
    layers:
    - state: lollypop-wrapped
      offset: 0, -0.25
    - state: lollypop-wrapped
      offset: -0.1, 0.1
    - state: lollypop-wrapped
      offset: 0.25, 0

- type: loadout
  id: FoodSnackLollypopMysteryWizard
  dummyEntity: FoodSnackLollypopWrappedMysteryDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChef
      time: 45h
  storage:
    back:
    - FoodSnackLollypopWrappedMystery
    - FoodSnackLollypopWrappedMysteryNeutral
    - FoodSnackLollypopWrappedMysteryEvil
  groupBy: "candy"

- type: entity
  parent: FoodSnackLollypopDylovene
  id: FoodSnackLollypopRainbowWizard
  name: rainbow lollypop
  description: An enchanted lollypop. What could go wrong?
  suffix: Loadout, Trinkets, Wizard
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
  - type: PointLight
    radius: 1.2
    energy: 1.5
  - type: RgbLightController
    layers: [ 1 ]
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: THC
          Quantity: 15

- type: entity
  parent: FoodSnackLollypopRainbowWizard
  id: FoodSnackLollypopRainbowWizardDummy
  categories: [ HideSpawnMenu ]
  name: three rainbow lollypops
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
      offset: 0, -0.25
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      offset: 0, -0.25
    - state: lollypop
      offset: -0.1, 0.1
    - state: color
      offset: -0.1, 0.1
    - state: lollypop
      offset: 0.25, 0
    - state: color
      offset: 0.25, 0
  - type: RgbLightController
    layers: [ 1, 3, 5 ]

- type: loadout
  id: FoodSnackLollypopRainbowWizard
  dummyEntity: FoodSnackLollypopRainbowWizardDummy
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobJanitor
      time: 45h
  storage:
    back:
    - FoodSnackLollypopRainbowWizard
    - FoodSnackLollypopRainbowWizard
    - FoodSnackLollypopRainbowWizard
  groupBy: "candy"

# endregion

