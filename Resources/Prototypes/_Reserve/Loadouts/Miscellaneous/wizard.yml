# region Towel

- type: entity
  parent: BaseTowel
  id: TowelColorWizard
  name: wizard towel
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#304094"
    - state: iconstripe
      color: "#943394"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#304094"
      right:
      - state: inhand-right
        color: "#304094"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#304094"
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#304094"
      belt:
      - state: equipped-BELT
        color: "#304094"
  - type: Fiber
    fiberColor: fibers-blue

- type: loadout
  id: TowelWizard
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:OverallPlaytimeRequirement
      time: 30h
  storage:
    back:
    - TowelColorWizard
  groupBy: "towels"

