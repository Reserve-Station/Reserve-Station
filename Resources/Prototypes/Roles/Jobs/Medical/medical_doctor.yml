- type: job
  id: MedicalDoctor
  name: job-name-doctor
  description: job-description-doctor
  playTimeTracker: JobMedicalDoctor
  requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 2.5h
  startingGear: DoctorGear
  icon: "JobIconMedicalDoctor"
  supervisors: job-supervisors-cmo
  guides: # goobstation
  - MedicalDoctor
  - Medical
  - Medicine
  goobcoins: 20 #Goob content
  weight: 9  # Reserve edit: Fix Assistant job order
  access:
  - Medical
  - Maintenance
  extendedAccess:
  - Chemistry
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: DoctorDay
    prototype: WehMedipen
  # Shitmed change
  - !type:AddComponentSpecial
    components:
    - type: SurgerySpeedModifier
      speedModifier: 1.5
  alternateTitles: # Reserve - alternate titles
  - MedicalDoctorPhysician
  - MedicalDoctorNurse
  - MedicalDoctorSurgeon

- type: startingGear
  id: DoctorGear
  equipment:
    ears: ClothingHeadsetMedical
    belt: ClothingBeltMedicalFilled
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: MedicalDoctorChameleonOutfit
  job: MedicalDoctor
  equipment:
    head: ClothingHeadNurseHat
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    neck: ClothingNeckStethoscope
    outerClothing: ClothingOuterCoatLab
    gloves: ClothingHandsGlovesLatex

- type: jobAlternateTitle
  id: MedicalDoctorSurgeon
  name: job-name-alt-medical-1

- type: jobAlternateTitle
  id: MedicalDoctorNurse
  name: job-name-alt-medical-2
  femaleName: job-name-alt-medical-2-f
  maleName: job-name-alt-medical-2-m

- type: jobAlternateTitle
  id: MedicalDoctorPhysician
  name: job-name-alt-medical-3
