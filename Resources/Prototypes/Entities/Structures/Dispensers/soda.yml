- type: entity
  parent: ReagentDispenserBase
  id: SodaDispenserEmpty
  name: soda dispenser
  description: A beverage dispenser with a selection of soda and several other common beverages. Has a single fill slot for containers.
  suffix: Empty
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: soda
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: SodaDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks

- type: entity
  parent: SodaDispenserEmpty
  id: SodaDispenser
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkCoconutWaterJug
        - id: DrinkCoffeeJug
        # - id: DrinkColaBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkCreamCartonXL
        - id: DrinkDrGibbJug
        - id: DrinkEnergyDrinkJug
        - id: DrinkGreenTeaJug
        - id: DrinkIceJug
        - id: DrinkJuiceBluePumpkinBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkMangoJuiceJug  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkJuiceLimeCartonXL
        - id: DrinkJuiceOrangeCartonXL
        # - id: DrinkLemonLimeJug  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkRootBeerJug
        # - id: DrinkSodaWaterBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        # - id: DrinkSpaceMountainWindBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        # - id: DrinkSpaceUpBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkSugarJug
        - id: DrinkTeaJug
        # - id: DrinkTonicWaterBottleFull  # Reserve: Orchid's Barmania - Vendichaos
        - id: DrinkWaterMelonJuiceJug
